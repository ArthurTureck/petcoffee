<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2a20">
<title>Pet Coffee • Central da Turma</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--dark:#3b2a20;--dark2:#4a372b;--cream:#f7f0e6;--beige:#efe3d1;--line:#e3d5c1;--car:#c8793a;--dcar:#9a4f1e;--sage:#4f6e54;--sage2:#e3ecd9;--pink:#f2b8b5;--muted:#6f5a49;--white:#fffdf9;--red:#b4462f;--r:18px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--dark);font-family:Nunito,system-ui,sans-serif;font-size:15px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;font-weight:600}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--dcar)}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
aside.side{background:var(--dark);color:var(--cream);padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand b{font-family:Fraunces,serif;font-size:20px;display:block}
.brand small{color:#d9c9b4;font-size:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:#eadbc7;text-decoration:none;font-weight:700}
.nav a:hover{background:var(--dark2)}
.nav a.on{background:var(--car);color:#2a1c13}
.side .foot{margin-top:auto;font-size:12px;color:#bfa98f;padding:8px}
main{padding:28px 32px 120px;max-width:1280px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:32px}
.top p{margin:4px 0 0;color:var(--muted)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--dcar);text-transform:uppercase}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;background:var(--dark);color:var(--cream)}
.btn:hover{filter:brightness(1.15)}
.btn.alt{background:var(--white);color:var(--dark);border:1px solid var(--line)}
.btn.car{background:var(--car);color:#2a1c13}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.danger{background:#f6e0da;color:var(--red)}
.btn.ok{background:var(--sage);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card h3{font-size:18px;margin-bottom:12px}
.tile .num{font-family:Fraunces,serif;font-size:36px;font-weight:600;color:var(--dcar);line-height:1.1}
.tile .lbl{color:var(--muted);font-weight:700;font-size:13px}
.tile.dark{background:var(--dark);color:var(--cream);border-color:var(--dark)}.tile.dark .num{color:#e0a46e}.tile.dark .lbl{color:#d9c9b4}
.tile.sage{background:var(--sage);color:var(--cream);border-color:var(--sage)}.tile.sage .num{color:#fff}.tile.sage .lbl{color:var(--sage2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--dark)}
.chip.on{background:var(--dark);color:var(--cream);border-color:var(--dark)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap;border:0;font-family:inherit}
button.pill{cursor:pointer}
button.pill:hover{outline:2px solid var(--car)}
.s-nao{background:#eee5d8;color:#6f5a49}.s-and{background:#dfeaf3;color:#2f5876}.s-ok{background:var(--sage2);color:#3a5a40}.s-atr{background:#f6e0da;color:var(--red)}
.bar{height:10px;border-radius:99px;background:#eee5d8;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--car)}
.stack{display:flex;height:22px;border-radius:8px;overflow:hidden;background:#eee5d8}
.stack>i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:700}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--white);cursor:pointer}
.item:hover{border-color:var(--car)}
.item .t{font-weight:800}
.item .m{font-size:13px;color:var(--muted);margin-top:2px}
.emo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--beige);flex:none;font-size:18px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#fbf6ee}
.kpi{display:flex;flex-direction:column;gap:8px}
.kpi .h{display:flex;justify-content:space-between;align-items:center;font-weight:800;gap:6px}
.kpi .v{font-family:Fraunces,serif;font-size:26px}
.kpi .s{font-size:12px;color:var(--muted)}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{background:var(--beige);border-radius:var(--r);padding:12px;min-height:200px}
.col h3{font-size:16px;display:flex;justify-content:space-between;margin:4px 6px 12px}
.tcard{background:var(--white);border-radius:14px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line)}
.tcard .t{font-weight:800}
.tcard .m{font-size:12px;color:var(--muted);margin:4px 0 8px}
.late{color:var(--red);font-weight:800}
.empty{padding:24px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r)}
.banner{background:#fff4dc;border:1px solid #efd39a;color:#6b4d12;padding:12px 16px;border-radius:14px;margin-bottom:18px;font-weight:700}
.org{display:flex;flex-direction:column;align-items:center}
.org .boss{background:var(--dark);color:var(--cream);border-radius:16px;padding:14px 26px;text-align:center;font-weight:800}
.org .vl{width:3px;height:22px;background:var(--car)}
.org .kids{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;width:100%;border-top:3px solid var(--car);padding-top:16px}
.org .kid{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-weight:800;font-size:13px}
.org .kid .e{font-size:22px;display:block}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow .st{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px}
.flow .st small{display:block;color:var(--dcar);font-size:11px;letter-spacing:.06em}
.flow .ar{color:var(--car);font-weight:800}
.mat{display:flex;flex-direction:column;gap:8px}
.mat .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--beige)}
.mat .t{font-weight:800;font-size:16px}
.mat .d{color:var(--muted);font-size:13px;flex:1}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--dark)}
textarea.in{min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:13px}
label.f small{font-weight:600;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(43,30,22,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:40}
.modal.on{display:flex}
.sheet{background:var(--cream);border-radius:22px;padding:22px;width:100%;max-width:720px}
.sheet h2{font-size:24px;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:var(--cream);padding:12px 18px;border-radius:12px;font-weight:700;display:none;z-index:50;max-width:90vw}
.donut{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.mobnav,.mhead,.fab,.mcards{display:none}
/* quinta */
.qhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qnum{font-family:Fraunces,serif;font-size:40px;font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.tab{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;color:var(--dark);font-size:14px;display:flex;gap:8px;align-items:center}
.tab small{color:var(--muted);font-weight:700}
.tab.on{background:var(--dark);color:var(--cream);border-color:var(--dark)}.tab.on small{color:#e0a46e}
.tab.live{box-shadow:0 0 0 3px var(--car)}
.ent{display:flex;flex-direction:column;gap:10px}
.ent .d{font-size:17px;font-weight:700;line-height:1.35;flex:1}
.ent .d.none{color:var(--muted);font-weight:600;font-style:italic}
.ent.ok{border-color:var(--sage);box-shadow:inset 0 0 0 2px var(--sage)}
.ent.no{border-color:var(--red);box-shadow:inset 0 0 0 2px #e9b8ac}
.rod{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.spark{display:block}
/* cronômetro discreto */
.timer{position:fixed;right:18px;bottom:18px;z-index:30;font-family:Nunito,sans-serif}
.tmini{display:flex;align-items:center;gap:8px;background:rgba(59,42,32,.92);color:var(--cream);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:0 6px 20px rgba(43,30,22,.25);backdrop-filter:blur(6px)}
.tmini .lab{font-size:12px;font-weight:800;color:#e0a46e;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tmini .clk{font-family:Fraunces,serif;font-size:20px;font-weight:600;min-width:62px;text-align:center;cursor:pointer;font-variant-numeric:tabular-nums}
.tmini button,.tpan button.ic{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:var(--cream);font-size:14px;cursor:pointer;display:grid;place-items:center}
.tmini button:hover,.tpan button.ic:hover{background:rgba(255,255,255,.25)}
.tmini .pg{position:absolute;left:14px;right:14px;bottom:2px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.tmini .pg i{display:block;height:100%;background:#e0a46e}
.tmini.end{background:rgba(180,70,47,.95);animation:pulse 1s infinite alternate}
.tmini.end .lab{color:#fff}
@keyframes pulse{to{transform:scale(1.04)}}
.tpan{position:absolute;right:0;bottom:56px;width:300px;background:rgba(59,42,32,.96);color:var(--cream);border-radius:18px;padding:14px;box-shadow:0 10px 30px rgba(43,30,22,.35);display:none}
.tpan.on{display:block}
.tpan .st{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700}
.tpan .st:hover{background:rgba(255,255,255,.08)}
.tpan .st.cur{background:rgba(200,121,58,.35)}
.tpan .st .n{flex:1}
.tpan .st .m{font-variant-numeric:tabular-nums;color:#e0a46e;min-width:46px;text-align:right}
.tpan .st button.ic{width:24px;height:24px;font-size:13px}
.tpan .tot{font-size:12px;color:#d9c9b4;margin-top:8px;display:flex;justify-content:space-between}
body.timer-hidden .timer{display:none}
.timer{display:none!important}
/* projetor */
body.proj{font-size:18px}
body.proj aside.side,body.proj .mhead,body.proj .mobnav{display:none!important}
body.proj .app{grid-template-columns:minmax(0,1fr)}
body.proj main{max-width:none;padding:28px 44px 120px}
body.proj .top h1{font-size:44px}
body.proj .top p{font-size:20px}
body.proj .card h3{font-size:24px}
body.proj .ent .d{font-size:24px}
body.proj .item .t,body.proj .tcard .t{font-size:20px}
body.proj .item .m,body.proj .kpi .s,body.proj .tile .lbl{font-size:16px}
body.proj .pill{font-size:16px;padding:5px 14px}
body.proj .tab{font-size:18px;padding:12px 18px}
body.proj .tmini .clk{font-size:30px;min-width:92px}
body.proj .tmini .lab{font-size:16px;max-width:260px}
body.proj .qnum{font-size:56px}
.rplan{border:1px solid var(--line);border-radius:14px;background:var(--white);padding:0;overflow:hidden}
.rplan summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.rplan summary::-webkit-details-marker{display:none}
.rplan summary .t{flex:1;font-weight:800;line-height:1.3;min-width:0}
.rplan summary .chev{transition:transform .2s;color:var(--muted)}
.rplan[open] summary .chev{transform:rotate(90deg)}
.rplan .b{padding:0 14px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;font-size:14px}
.rplan .b div b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dcar)}
.mine{display:inline-block;font-size:11px;font-weight:800;background:var(--sage2);color:var(--sage);border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.rbox{border:1px solid var(--line);border-radius:14px;background:var(--white);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rbox.new{border-color:var(--car);box-shadow:0 0 0 2px rgba(200,121,58,.15)}
.rbox .m{font-size:12px;color:var(--muted);font-weight:700;display:flex;flex-wrap:wrap;gap:4px 12px}
.rbox .txt{white-space:pre-wrap;word-break:break-word}
.rform textarea.in{min-height:96px}
.stp{display:inline-flex;align-items:center;gap:8px}
.stp i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--car);color:#2a1c13;font-size:12px;font-weight:800;font-family:Nunito,sans-serif}
.stp.big i{width:28px;height:28px;font-size:15px}
.okbox{background:var(--sage2);color:var(--sage);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:700}
.sech{font-family:Fraunces,serif;font-size:22px;margin:22px 0 12px}
.qdate{font-size:18px;color:var(--muted);font-weight:700}
.qcard{display:flex;flex-direction:column;gap:12px}
.qcard.done{cursor:pointer;border-color:#cfdcc4}
.qcard.done:hover{box-shadow:0 8px 22px rgba(59,42,32,.08)}
.qcard .who{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;font-weight:700;color:var(--muted);margin-top:2px}
.qcard .who .ok{color:var(--sage)}
.qcard .focus{background:var(--cream);border-radius:12px;padding:10px 12px;font-size:14px}
.qcard .lastr{font-size:14px;border-left:3px solid var(--sage);padding-left:10px}
.qcard .lastr .m{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px}
.qcard .lastr.none{border-left-color:var(--line);color:var(--muted);font-style:italic}
.cta{display:flex;gap:14px;align-items:center;text-decoration:none;color:inherit;margin-bottom:6px;border-color:var(--car);background:#fff7ee}
.cta div div{font-size:14px;color:var(--muted)}
.ff{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:13px}
.ff small{font-weight:600;color:var(--muted)}
small.req{color:var(--dcar)!important;font-weight:800!important}
.fbtn{align-self:flex-start;cursor:pointer;display:inline-flex}
.fprev{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fprev img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.rfoto{padding:0;border:0;background:none;cursor:zoom-in;align-self:flex-start}
.rfoto img{max-width:180px;max-height:140px;border-radius:10px;border:1px solid var(--line);display:block}
@media (max-width:900px){.qgrid{grid-template-columns:minmax(0,1fr)!important}.qhead{flex-wrap:wrap;gap:8px}.qhead .qnum{font-size:30px}.qdate{font-size:14px}.rplan .b{grid-template-columns:minmax(0,1fr)}.rform .btn{width:100%}}
@media (max-width:900px){
 .app{grid-template-columns:minmax(0,1fr)}
 aside.side{display:none}
 .mhead{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:var(--dark);color:var(--cream);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
 .mhead b{font-family:Fraunces,serif;font-size:17px;display:block;line-height:1.1}
 .mhead small{font-size:11px;color:#d9c9b4}
 .mobnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--dark);padding:6px 4px;padding-bottom:calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.15)}
 .mobnav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#d9c9b4;text-decoration:none;font-weight:800;font-size:10px;padding:6px 2px;border-radius:10px;text-align:center;line-height:1.1;cursor:pointer}
 .mobnav a i{font-style:normal;font-size:20px}
 .mobnav a.on{background:var(--car);color:#2a1c13}
 main{padding:16px 14px calc(150px + env(safe-area-inset-bottom))}
 .top{margin-bottom:14px;align-items:stretch}
 .top h1{font-size:25px}
 .top p{font-size:14px}
 .top>.row{width:100%}
 .top>.row .btn{flex:1}
 .hide-m{display:none!important}
 .grid{gap:10px}
 .g4,.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:minmax(0,1fr)}
 #g21,.rod{grid-template-columns:minmax(0,1fr)!important}
 .card{padding:14px;border-radius:16px}
 .tile .num{font-size:28px}.tile .lbl{font-size:12px}
 .kpi .v{font-size:22px}.kpi .h{font-size:13px;flex-direction:column;align-items:flex-start}.kpi .s{font-size:11px}
 .srow{grid-template-columns:96px minmax(0,1fr) 34px!important;gap:8px!important}
 .srow>div:first-child{font-size:12px!important}
 .chips,.tabs{flex-wrap:nowrap;overflow-x:auto;margin-left:-14px;margin-right:-14px;padding:2px 14px 6px;scrollbar-width:none}
 .chips::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
 .chip,.tab{white-space:nowrap;flex:none}
 .filters{display:grid!important;grid-template-columns:minmax(0,1fr);gap:8px}
 .filters select,.filters input{max-width:none!important;width:100%!important}
 .ptable{display:none}
 .mcards{display:flex;flex-direction:column;gap:10px}
 .pc{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
 .pc .t{font-weight:800;font-size:15px;line-height:1.3}
 .pc .w{font-size:13px;color:var(--muted)}
 .pc .f{display:flex;gap:4px 12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:700}
 .kanban{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;margin:0 -14px;padding:0 14px 8px}
 .col{flex:0 0 86%;scroll-snap-align:center}
 .swipe{display:block!important}
 .org .kids{grid-template-columns:repeat(2,1fr)}
 .fgrid{grid-template-columns:minmax(0,1fr)}
 input.in,select.in,textarea.in{font-size:16px;padding:11px 12px}
 .modal{padding:0;align-items:flex-end}
 .sheet{border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
 .sheet .acts{position:sticky;bottom:-18px;background:var(--cream);padding:12px 0 4px}
 .sheet .acts .btn{flex:1}
 .fab{display:flex;position:fixed;left:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:24;width:54px;height:54px;border-radius:50%;background:var(--car);color:#2a1c13;border:0;font-size:28px;font-weight:800;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(59,42,32,.35)}

function tLeft(){if(T.left==null)T.left=curB().min*60;return T.left}
function renderTimer(){const B=BLOCOS(),b=curB(),left=tLeft(),tot=b.min*60,p=tot?Math.min(100,(1-left/tot)*100):0;

const SR={res:null,extra:'trio',anim:null};
function sortPlan(){
 const L=SETORES.filter(s=>!s.nova||G().tecAtivo||SR.extra==='tec');
 const fix=S.alunos.filter(a=>a.fixo&&a.setor);const pool=S.alunos.filter(a=>!(a.fixo&&a.setor)).map(a=>a.id);
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 const res={};fix.forEach(a=>res[a.id]={setor:a.setor,funcao:a.funcao});
 const slots=[];SETORES.filter(s=>!s.nova).forEach(s=>s.f.forEach(fn=>{if(!fix.some(a=>a.setor===s.k&&a.funcao===fn))slots.push([s.k,fn])}));
 slots.sort(()=>Math.random()-.5);
 while(pool.length&&slots.length){const [k,fn]=slots.shift();res[pool.shift()]={setor:k,funcao:fn}}
 if(pool.length&&SR.extra==='tec'){SK.tecnologia.f.forEach(fn=>{if(pool.length)res[pool.shift()]={setor:'tecnologia',funcao:fn}})}
 const alvo=SETORES.filter(s=>!s.nova&&s.k!=='diretoria').map(s=>s.k).sort(()=>Math.random()-.5);
 while(pool.length){const k=alvo.shift()||'atendimento';res[pool.shift()]={setor:k,funcao:'Apoio'}}
 return res}
function sortView(res,spin){const byId=Object.fromEntries(S.alunos.map(a=>[a.id,a]));const fixN=S.alunos.filter(a=>a.fixo&&a.setor).length;const free=S.alunos.length-fixN;const vagas=SETORES.filter(s=>!s.nova).reduce((t,s)=>t+s.f.length,0)-fixN;
 const L=SETORES.filter(s=>!s.nova||G().tecAtivo||SR.extra==='tec'||(res&&Object.values(res).some(r=>r.setor===s.k)));
 const cell=(s)=>{const M=res?Object.entries(res).filter(([,r])=>r.setor===s.k).map(([id,r])=>({n:byId[id]?byId[id].nome:'?',f:r.funcao,fx:byId[id]&&byId[id].fixo})):[];
  return `<div class="card" style="padding:12px 14px"><b>${s.e} ${esc(s.n)}</b>${M.length?M.map(m=>`<div style="font-size:${spin?15:16}px;margin-top:6px;${spin?'opacity:.55':''}"><b>${esc(m.n)}</b> <span style="font-size:12px;color:var(--muted)">${esc(m.f)}${m.fx?' 📌':''}</span></div>`).join(''):`<div style="font-size:22px;color:var(--muted);margin-top:6px">❔ ❔</div>`}</div>`};
 return `<h2>🎲 Sorteio das duplas</h2><p style="color:var(--muted);margin-top:-6px">${free} alunos no sorteio para ${vagas} vagas • 📌 fixos ficam onde estão.</p>
 ${free>vagas?`<div class="row" style="margin-bottom:12px;font-size:14px"><b>Aluno(s) a mais (${free-vagas}):</b><button class="chip ${SR.extra==='trio'?'on':''}" data-act="sortExtra" data-v="trio">Formar trio num setor sorteado</button><button class="chip ${SR.extra==='tec'?'on':''}" data-act="sortExtra" data-v="tec">💻 Abrir Tecnologia</button></div>`:''}
 <div class="grid g3" style="gap:10px">${L.map(cell).join('')}</div>
 <div class="row acts" style="margin-top:16px"><button type="button" class="btn alt" data-act="close">Fechar</button><span class="sp"></span><button class="btn alt" data-act="sortGo" ${spin?'disabled':''}>${res&&!spin?'🎲 Sortear de novo':'🎲 Sortear'}</button>${res&&!spin?`<button class="btn car" data-act="sortOk">✅ Confirmar e salvar</button>`:''}</div>`}
function sortGo(){clearInterval(SR.anim);let t=0;SR.anim=setInterval(()=>{t++;const r=sortPlan();if(t>=22){clearInterval(SR.anim);SR.res=r;$('#sheet').innerHTML=sortView(r,false);return}$('#sheet').innerHTML=sortView(r,true)},90)}
async function sortOk(){const res=SR.res;if(!res)return;let ok=true;for(const a of S.alunos){const r=res[a.id]||{setor:'',funcao:''};if(a.setor!==r.setor||a.funcao!==r.funcao){ok=(await wr(()=>db.doc('alunos/'+a.id).update({setor:r.setor,funcao:r.funcao,atualizado:Date.now()})))&&ok}}
 if(SR.extra==='tec'&&Object.values(res).some(r=>r.setor==='tecnologia')&&!G().tecAtivo)await saveGeral({tecAtivo:true});
 await wr(()=>db.doc('config/sorteio').set({em:Date.now(),extra:SR.extra}));closeM();if(ok)toast('Duplas salvas! 🎉')}
async function assignRole(id,k,fn){/* coloca o aluno id na função fn do setor k; se a função estava ocupada, as duas pessoas trocam de lugar */
 const cur=S.alunos.find(a=>a.setor===k&&a.funcao===fn&&a.id!==id);const mov=id?S.alunos.find(a=>a.id===id):null;
 const from=mov&&mov.setor&&SK[mov.setor]?{setor:mov.setor,funcao:mov.funcao}:{setor:'',funcao:''};
 if(cur)await wr(()=>db.doc('alunos/'+cur.id).update({setor:from.setor,funcao:from.funcao,atualizado:Date.now()}));
 if(id)await wr(()=>db.doc('alunos/'+id).update({setor:k,funcao:fn,atualizado:Date.now()}));
 toast(!id?'Vaga liberada':cur&&from.setor?`${cur.nome} e ${mov.nome} trocaram de lugar 🔄`:'Equipe atualizada ✨')}

async function save(filename,data,type){try{await dl.save({filename,data})}catch(e){try{await dl.save({filename,data:new Blob([data],{type})})}catch(e2){toast('Download não concluído.')}}}

 save('pet-coffee-planos-de-acao.csv','﻿'+[H.map(q).join(';'),...rows].join('\r\n'),'text/csv')}
function exportBackup(){const strip=L=>L.map(x=>Object.assign({},x));const o={geradoEm:new Date().toISOString(),geral:G(),empresa:cfg(),indicadores:S.kpis,acoes:strip(S.actions),tarefas:strip(S.tasks),alunos:strip(S.alunos),materiais:strip(S.mats),entregas:strip(S.entregas),atas:strip(S.atas),historicoIndicadores:strip(S.kpihist),sorteio:S.sorteio};

(async()=>{
 const timer=setTimeout(()=>{if(!S.ready){S.slow=true;render()}},10000);
 S.canWrite=false;
 try{
  const B='https://www.gstatic.com/firebasejs/10.14.1/';
  const [ap,fs,au]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-firestore.js'),import(B+'firebase-auth.js')]);
  const A=ap.initializeApp(FB_CFG);const F=fs.getFirestore(A);const auth=au.getAuth(A);FB={fs,au,auth,F};
  const base='turmas/'+TURMA+'/';const M={includeMetadataChanges:true};const dref=p=>fs.doc(F,base+p);
  const wd=d=>({id:d.id,exists:d.exists(),data:()=>d.data()});
  db={collection:p=>({onSnapshot:(cb,er)=>fs.onSnapshot(fs.collection(F,base+p),M,s=>cb({docs:s.docs.map(wd),metadata:s.metadata}),er),add:o=>fs.addDoc(fs.collection(F,base+p),o)}),
   doc:p=>({onSnapshot:(cb,er)=>fs.onSnapshot(dref(p),M,s=>cb({exists:s.exists(),data:()=>s.data(),metadata:s.metadata}),er),set:o=>fs.setDoc(dref(p),o),update:o=>fs.updateDoc(dref(p),o),delete:()=>fs.deleteDoc(dref(p))})};
  let subs=false;

  const err=e=>{clearTimeout(timer);S.ready=true;if(e&&e.code==='permission-denied')S.offline=true;render()};

 }catch(e){clearTimeout(timer);S.offline=true;render()}
